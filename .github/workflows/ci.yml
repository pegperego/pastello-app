# Quality gates for every pull request and for main (ADR 0015).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the version used by contributors (ADR 0002).
  FLUTTER_VERSION: "3.44.0"

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Only tracked files: generated localizations are not formatted.
      - name: Check formatting
        run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze app packages prototype

      - name: Test the engine
        working-directory: packages/pastello_engine
        run: flutter test --coverage

      - name: Check engine coverage (≥ 90%)
        run: tool/check_coverage.sh packages/pastello_engine/coverage/lcov.info 90

      - name: Test the app
        working-directory: app
        run: flutter test --coverage

      # App logic only: widgets and generated code are excluded (ADR 0015).
      - name: Check app logic coverage (≥ 70%)
        run: tool/check_coverage.sh app/coverage/lcov.info 70 '/presentation/|/l10n/generated/'

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: |
            packages/pastello_engine/test/failures/
            app/test/**/failures/
          if-no-files-found: ignore

  android:
    name: Build APK and check permissions
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: No network permission in the release build (ADR 0003)
        run: tool/check_permissions.sh app/build/app/outputs/flutter-apk/app-release.apk
