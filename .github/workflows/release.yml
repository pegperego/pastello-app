# Signed builds for a version tag (ADR 0016): an APK attached to a GitHub
# Release and an AAB to upload to Google Play. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, so only this job can
    # read them.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the app version
        run: |
          version=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' app/pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in app/pubspec.yaml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PASTELLO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PASTELLO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK and the AAB
        working-directory: app
        env:
          PASTELLO_KEYSTORE_PASSWORD: ${{ secrets.PASTELLO_KEYSTORE_PASSWORD }}
          PASTELLO_KEY_ALIAS: ${{ secrets.PASTELLO_KEY_ALIAS }}
          PASTELLO_KEY_PASSWORD: ${{ secrets.PASTELLO_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: No network permission in the release build (ADR 0003)
        run: tool/check_permissions.sh app/build/app/outputs/flutter-apk/app-release.apk

      - name: Signed with the release key, not the debug one
        run: |
          # The newest build-tools: runners have several installed.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          signer=$("$apksigner" verify --print-certs \
            app/build/app/outputs/flutter-apk/app-release.apk | grep -m1 'certificate DN')
          echo "$signer"
          if echo "$signer" | grep -q 'CN=Android Debug'; then exit 1; fi

      - name: Collect the files
        run: |
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/pastello-$VERSION.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "dist/pastello-$VERSION.aab"
          (cd dist && sha256sum "pastello-$VERSION.apk" > SHA256SUMS)
          # The notes are this version's section of the changelog.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Keep the AAB for Google Play
        uses: actions/upload-artifact@v7
        with:
          name: pastello-${{ env.VERSION }}-aab
          path: dist/pastello-${{ env.VERSION }}.aab

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pastello $VERSION" \
            --notes-file notes.md \
            "dist/pastello-$VERSION.apk" dist/SHA256SUMS

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
