name: Bug report
description: Something does not work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please **do not attach drawings or screenshots that show a child's name, face or other personal data**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new sheet
        2. Select the eraser
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Samsung Galaxy Tab A8, Android 14
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input method
      options:
        - Finger
        - Stylus
        - Both
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remember to remove any personal data.
