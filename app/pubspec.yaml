name: pastello
description: "Pastello: a free, offline drawing app for kids."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  archive: ^4.5.2
  audioplayers: ^6.8.1
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  gal: ^2.3.3
  intl: any
  package_info_plus: ^10.2.2
  pastello_engine:
    path: ../packages/pastello_engine
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true

  # Bundled fonts, never downloaded at runtime (ADR 0003). SIL OFL 1.1.
  fonts:
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
        - asset: assets/fonts/Andika-Bold.ttf
          weight: 700
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: PlaywriteITModerna
      fonts:
        - asset: assets/fonts/PlaywriteITModerna.ttf
    - family: ComicNeue
      fonts:
        - asset: assets/fonts/ComicNeue-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/Andika-OFL.txt
    - assets/fonts/Fredoka-OFL.txt
    - assets/fonts/PlaywriteITModerna-OFL.txt
    - assets/fonts/ComicNeue-OFL.txt
    - assets/icons/tools/
    - assets/icons/actions/
    - assets/mascot.svg
    - assets/sounds/
    - assets/packs/
    - assets/packs/fluent-animals/
    - assets/packs/fluent-animals/stickers/
    - assets/packs/fluent-nature/
    - assets/packs/fluent-nature/stickers/
    - assets/packs/fluent-food/
    - assets/packs/fluent-food/stickers/
    - assets/packs/fluent-hearts/
    - assets/packs/fluent-hearts/stickers/
    - assets/packs/fluent-faces/
    - assets/packs/fluent-faces/stickers/
    - assets/packs/fluent-school/
    - assets/packs/fluent-school/stickers/
    - assets/packs/fluent-vehicles/
    - assets/packs/fluent-vehicles/stickers/
    - assets/packs/fluent-party/
    - assets/packs/fluent-party/stickers/
    - assets/packs/pastello-first/
    - assets/packs/pastello-first/coloring/
